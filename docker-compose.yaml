services:
  spark-master:
    image: apache/spark:3.5.1
    user: root
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-network

  spark-worker1:
    image: apache/spark:3.5.1
    user: root
    container_name: spark-worker1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1G"
    volumes:
      - .:/home/jovyan/work
    networks:
      - spark-network

  spark-worker2:
    image: apache/spark:3.5.1
    user: root
    container_name: spark-worker2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1G"
    volumes:
      - .:/home/jovyan/work
    networks:
      - spark-network
  

  jupyter:
    build:
      context: ./
      dockerfile: Dockerfile.notebook
    container_name: spark-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    
    networks:
      - spark-network
    depends_on:
      - spark-master

networks:
  spark-network:
    driver: bridge

